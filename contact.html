<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Smooth Official</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <header>
    <nav class="nav">
      <div class="text1">
        <h1>Smooth Official</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="contact-hero">
    <h2 class="contact-tag">GET IN TOUCH</h2>
    <h1>Let's Talk</h1>
    <p class="contact-subtext">Have a project in mind, a question, or just want to say hi? Fill out the form below.</p>
  </section>

  <section class="contact-form-section">
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your email" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your message here..." rows="5" required></textarea>
      </div>

      <button type="submit" class="contact-btn">Send Message →</button>
    </form>
  </section>

</body>
</html>
